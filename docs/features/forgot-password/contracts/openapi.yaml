openapi: 3.1.0
info:
  title: Forgot / Reset / Change Password API
  version: 0.1.0
  description: |
    Lets a job-seeker with a Local (email+password) account recover access via an emailed,
    single-use reset link, and change their password while logged in. A job-seeker whose account
    signs in with Google OAuth (no stored password) is told so explicitly instead of hitting a
    dead end (idea-brief §2-4; PRD §1-2). Scoped entirely to Local accounts — Google-only accounts
    never get a real reset flow (PRD §3 Non-goals).

    Generated by api-forge (SDLC stage 10) — scenario A (docs/features/forgot-password/data-model.md
    present). See api-sync-report.md alongside this file for the field-origin trace and drift check.

servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local

security:
  - cookieAuth: []

paths:
  /auth/password-reset/request:
    post:
      summary: Request a password-reset email for a Local account
      description: |
        Always responds 200. Never reveals whether the given email belongs to a registered Local
        account (PRD AC-02) — an unregistered email and a registered Local account get the
        identical `status: sent` confirmation. The one carved-out exception (PRD AC-05): an email
        that belongs to a Google-only account gets `status: google_account` instead, so that
        job-seeker isn't left waiting for an email that will never arrive.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
            example:
              email: jordan@example.test
      responses:
        "200":
          description: >-
            Request accepted. Body distinguishes only the Google-account case (AC-05); it never
            distinguishes "unregistered" from "registered Local account" (AC-02).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResult"
              examples:
                sent:
                  summary: Unregistered email or registered Local account (identical response)
                  value: { status: sent, message: "If that email is registered, a reset link is on its way." }
                google_account:
                  summary: Email belongs to a Google-only account
                  value: { status: google_account, message: "This account signs in with Google. Use Sign in with Google instead." }
        "400":
          description: Validation error (missing/malformed email)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: auth.validation_error, message: "email is required" }
        "429":
          description: >-
            Rate limit exceeded (PRD §6 NFR: ≤3 requests/hour/email). Applies only to registered
            Local-account emails — see api-sync-report.md unresolved_origins for the open question
            on how (or whether) unregistered emails are rate-limited too (data-model.md §Indexes
            comment: "flagged as open implementation question, not a schema gap").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: password_reset.rate_limited, message: "Too many reset requests. Try again later." }

  /auth/password-reset/confirm:
    post:
      summary: Set a new password using a reset token from the emailed link
      description: |
        Consumes the single-use reset token (PRD AC-01, AC-03). The token is looked up by its
        hash (`PasswordReset.tokenHash`, data-model.md) and atomically deleted on successful use
        (ADR-0001) — an already-used or expired token always fails the same way. On success, bumps
        `User.tokenVersion` so every other active session is invalidated (PRD AC-06, ADR-0002).
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmInput"
            example:
              token: 3f7a1c9e8b2d4f60a91c7e5b3d2a1f00
              newPassword: correct-horse-battery
      responses:
        "200":
          description: Password set; the job-seeker can log in with it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
              example: { ok: true }
        "400":
          description: >-
            Either the token is invalid/expired/already used (AC-03, AC-05 US-05), or newPassword
            fails validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalid_or_expired_token:
                  value: { code: password_reset.invalid_or_expired, message: "This reset link is invalid or has expired. Request a new one." }
                weak_password:
                  value: { code: auth.validation_error, message: "password must be at least 8 characters" }

  /auth/password:
    patch:
      summary: Change password while logged in
      description: |
        Requires an active session (`requireAuth`, cookie-based). On success, bumps
        `User.tokenVersion` so every other active session is invalidated (PRD AC-06, ADR-0002).
        A Google-only account (no `passwordHash`) gets the same explanatory response as the
        reset-request endpoint (PRD AC-05, US-04) instead of a confusing "wrong password" error.
      operationId: changePassword
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
            example:
              currentPassword: correct-horse-battery
              newPassword: another-correct-horse
      responses:
        "200":
          description: Password changed; all other sessions invalidated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
              example: { ok: true }
        "400":
          description: >-
            Either the supplied current password is wrong (AC-04), or newPassword fails
            validation. The stored password is left unchanged in both cases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                wrong_current_password:
                  value: { code: auth.incorrect_current_password, message: "Current password is incorrect." }
                weak_password:
                  value: { code: auth.validation_error, message: "password must be at least 8 characters" }
        "401":
          description: Not authenticated (missing/invalid/expired session cookie).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: auth.not_authenticated, message: "Not authenticated" }
        "409":
          description: >-
            Account has no password to change — it signs in with Google only (PRD AC-05, US-04).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: auth.google_account_no_password, message: "This account signs in with Google and has no password to change." }

components:
  securitySchemes:
    # Deviation from api-forge's BearerAuth default: this project's requireAuth
    # (src/middleware/auth.ts) reads the JWT from an httpOnly `token` cookie set by
    # issueSession(), never from an Authorization header. cookieAuth matches the real
    # implementation instead of the skill's generic default — see api-sync-report.md.
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: "auth.validation_error" }
        message: { type: string }
        details: { type: object }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    PasswordResetRequestInput:
      type: object
      required: [email]
      properties:
        # origin: User.email (data-model.md User entity) — high confidence
        email: { type: string, format: email }

    PasswordResetRequestResult:
      type: object
      required: [status]
      properties:
        # origin: inferred from PRD AC-02 (generic confirmation) + AC-05 (Google-account
        # explanation) — medium confidence, no literal field in data-model.md
        status:
          type: string
          enum: [sent, google_account]
        message: { type: string }

    PasswordResetConfirmInput:
      type: object
      required: [token, newPassword]
      properties:
        # origin: raw token emailed to the job-seeker; data-model.md PasswordReset.tokenHash
        # stores only its sha256 hex digest (never the raw value) — high confidence, per
        # data-model.md PasswordReset.tokenHash note and ADR-0001
        token: { type: string, minLength: 1 }
        # origin: writes User.passwordHash after bcrypt hashing; minLength 8 matches the existing
        # PASSWORD_MIN_LENGTH constant in src/controllers/auth.controller.ts (PRD reference
        # module note) — high confidence
        newPassword: { type: string, minLength: 8 }

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        # origin: compared against User.passwordHash via bcrypt.compare — high confidence
        currentPassword: { type: string, minLength: 1 }
        # origin: same as PasswordResetConfirmInput.newPassword — high confidence
        newPassword: { type: string, minLength: 8 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
